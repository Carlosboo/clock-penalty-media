name: Generate private gameplay commentator

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type GENERAR to create the Spanish ElevenLabs narration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gameplay-commentator
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.confirmation == 'GENERAR'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate and encrypt narration for this session
        working-directory: app
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GAMEPLAY_COMMENTATOR_REQUEST: ${{ secrets.GAMEPLAY_COMMENTATOR_REQUEST }}
          GAMEPLAY_APP_DIR: ${{ github.workspace }}/app
        run: |
          mkdir audio
          node scripts/gameplay-voice-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-gameplay-commentator
          path: app/voice-preview.enc.json
          if-no-files-found: warn
          retention-days: 2
