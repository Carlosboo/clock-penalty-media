name: Publish Clock Penalty marketing

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-relaunch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check publication gate
        id: gate
        working-directory: app
        run: |
          mode=$(node -p "JSON.parse(require('fs').readFileSync('scripts/instagram-relaunch-operation.json')).mode")
          if [ "$mode" = "hold" ]; then
            echo "::warning::Publication is paused; no API calls or narration generation."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$mode" = "publish" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported publication mode."
            exit 1
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: instagram-relaunch-state
          path: state
      - name: Configure publication checkpoint identity
        if: steps.gate.outputs.publish == 'true'
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish approved content
        if: steps.gate.outputs.publish == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLISH_STATE_DIR: ${{ github.workspace }}/state
        run: node app/scripts/instagram-relaunch.mjs
