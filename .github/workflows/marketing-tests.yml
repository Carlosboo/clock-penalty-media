name: Marketing tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/**
      - assets/marketing/creator-remotion/src/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - scripts/**
      - assets/marketing/creator-remotion/src/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test scripts/*.test.mjs assets/marketing/creator-remotion/src/timeline.test.mjs
